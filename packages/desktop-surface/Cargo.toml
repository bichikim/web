[package]
name = "tauri-plugin-desktop-surface"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-desktop-surface"
description = "Tauri desktop background and transparent control surfaces"
license = "MIT"

[package.metadata.platforms.support]
macos = { level = "full", notes = "Background placement uses public AppKit and Core Graphics APIs. Transparent WebViews require Tauri's macOS private API feature." }
windows = { level = "partial", notes = "Native widgets and Explorer-hosted desktop surfaces are supported. Explorer hosting uses its version-dependent WorkerW protocol; shell restart and display-change recovery are not implemented." }
linux = { level = "none" }
android = { level = "none" }
ios = { level = "none" }

[lib]
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tauri = { version = "2", features = ["macos-private-api", "unstable"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSEvent",
  "NSGraphicsContext",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSResponder",
  "NSWorkspace",
  "NSGraphics",
  "objc2-quartz-core",
] }
objc2-core-graphics = { version = "0.3.2", features = ["CGWindowLevel"] }
objc2-foundation = { version = "0.3.2", features = [
  "block2",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "objc2-core-foundation"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
