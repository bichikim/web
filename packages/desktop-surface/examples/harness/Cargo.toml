[package]
name = "desktop-surface-harness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3.2", features = ["CGWindowLevel"] }
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSString"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-desktop-surface = { path = "../.." }
