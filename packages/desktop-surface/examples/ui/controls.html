<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomo Controls</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="controls.js" defer></script>
  </head>
  <body class="control-page">
    <main class="control-card">
      <p class="eyebrow">Transparent control surface</p>
      <h1>Pomo controls</h1>
      <p>Player and pomodoro controls stay interactive here.</p>
      <div class="actions">
        <button id="background-interaction" type="button">Disable background input</button>
        <button id="interact" type="button">Interaction count: 0</button>
        <button id="restore" type="button">Restore background</button>
      </div>
      <output id="status">Interactive</output>
    </main>
  </body>
</html>
