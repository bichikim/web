[workspace]
resolver = "3"
members = ["format", "runtime", "worker"]

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
poffo-format = { path = "format" }
poffo-runtime = { path = "runtime" }
brotli-decompressor = { version = "=6.2.0", default-features = false, features = ["std"] }
png = { version = "=0.18.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = [
  "std",
  "float_roundtrip",
] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = "debuginfo"
