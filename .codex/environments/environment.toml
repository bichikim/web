# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "web"

[setup]
script = "cd "

[setup.darwin]
script = '''
# AI_NOTE - Warm dependencies and Turbo outputs in a clean source `dev` so new worktrees can reuse them.
SOURCE_TREE_PATH="${CODEX_SOURCE_TREE_PATH:-}"
if [ -n "$SOURCE_TREE_PATH" ]; then
  git -C "$SOURCE_TREE_PATH" fetch origin
  if [ "$(git -C "$SOURCE_TREE_PATH" branch --show-current)" = "dev" ] &&
    [ -z "$(git -C "$SOURCE_TREE_PATH" status --porcelain)" ] &&
    git -C "$SOURCE_TREE_PATH" merge-base --is-ancestor HEAD origin/dev; then
    git -C "$SOURCE_TREE_PATH" merge --ff-only origin/dev
    (cd "$SOURCE_TREE_PATH" && pnpm install --frozen-lockfile)
  fi
fi

cd "$CODEX_WORKTREE_PATH"
REPOSITORY_PATH="${CODEX_SOURCE_TREE_PATH:-$(dirname "$(git rev-parse --git-common-dir)")}"

# New worktree with no local commits/changes: align onto latest origin/dev.
if [ -z "$(git status --porcelain)" ] && [ "$(git rev-list --count origin/dev..HEAD 2>/dev/null || echo 1)" -eq 0 ]; then
  git reset --hard origin/dev
fi

if [ -f "$REPOSITORY_PATH/apps/coong/.env" ]; then
  cp "$REPOSITORY_PATH/apps/coong/.env" apps/coong/.env
fi
# Mirror .cursor/worktrees.json: reuse main worktree Turbo cache before install/prepare-build.
if [ -d "$REPOSITORY_PATH/.turbo" ]; then
  cp -R "$REPOSITORY_PATH/.turbo" .turbo
fi
pnpm install --frozen-lockfile
git config user.name "kimbichi"
git config user.email "bichi@live.co.kr"
'''
