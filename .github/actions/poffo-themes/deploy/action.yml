name: Deploy Poffo Themes
description: Deploy the verified catalog and promote production after smoke checks.
inputs:
  target:
    description: preview for dev or production for main.
    required: true
  token:
    description: Vercel token for the deployment.
    required: true
outputs:
  url:
    description: URL of the verified deployment.
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: composite
  steps:
    - name: Validate source and project configuration
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: |
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        case "${TARGET}:${GITHUB_REF}" in
          preview:refs/heads/dev|production:refs/heads/main) ;;
          *) echo '::error::Preview requires dev; production requires main.'; exit 1 ;;
        esac
        test -n "$VERCEL_PROJECT_ID" || {
          echo '::error::Set the POFFO_THEMES_VERCEL_PROJECT_ID Actions variable.'
          exit 1
        }
        test -n "$VERCEL_TOKEN" || {
          echo '::error::Set the VERCEL_TOKEN Actions secret.'
          exit 1
        }
    - uses: pnpm/action-setup@v6
      with:
        version: 11.8.0
    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
    - name: Pull Vercel settings
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: |
        args=(--yes --environment="$TARGET" --local-config=apps/poffo-themes/vercel.json)
        if test "$TARGET" = preview; then
          args+=(--git-branch="$GITHUB_REF_NAME")
        fi
        pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull "${args[@]}" --token="$VERCEL_TOKEN"
    - uses: actions/download-artifact@v4
      with:
        name: poffo-themes-static
        path: .vercel/output
    - name: Deploy verified artifact
      id: deploy
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: |
        args=(--prebuilt --yes --format=json --local-config=apps/poffo-themes/vercel.json)
        if test "$TARGET" = production; then
          args+=(--prod --skip-domain)
        else
          args+=(--target=preview)
        fi
        deployment="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy "${args[@]}" \
          --token="$VERCEL_TOKEN" --meta githubCommitSha="$GITHUB_SHA" \
          --meta githubCommitRef="$GITHUB_REF_NAME")"
        url="$(node --input-type=module -e '
          import {readFileSync} from "node:fs"
          const {deployment} = JSON.parse(readFileSync(0, "utf8"))
          const target = deployment?.target === null ? "preview" : deployment?.target
          if (target !== process.env.TARGET || deployment?.readyState !== "READY") {
            throw new Error("Vercel did not return a ready deployment for the requested target")
          }
          const url = new URL(deployment.url)
          if (url.protocol !== "https:" || !url.hostname.endsWith(".vercel.app")) {
            throw new Error("Unexpected Vercel deployment URL")
          }
          console.log(url.origin)
        ' <<< "$deployment")"
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
        echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - name: Check deployed catalog and downloads
      shell: bash
      env:
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: |
        response="$(mktemp)"
        trap 'rm -f "$response"' EXIT
        fetch_deployment() {
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" curl "$1" --deployment="$DEPLOYMENT_URL" \
            -- --fail --silent --show-error --max-time 30 --output "$response"
        }
        fetch_deployment /
        grep -Eq '<title([[:space:]][^>]*)?>Poffo Themes</title>' "$response"
        for archive in .vercel/output/static/download/*.poffotheme; do
          fetch_deployment "/download/${archive##*/}"
          cmp "$archive" "$response"
        done
    - name: Promote verified production deployment
      if: inputs.target == 'production'
      shell: bash
      env:
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
