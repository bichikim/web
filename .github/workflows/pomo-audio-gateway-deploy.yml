name: Deploy Pomo

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/pomo-audio-gateway-deploy.yml'
      - 'apps/pomo/**'
      - 'apps/pomo-audio-gateway/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - production
      staging_branch:
        description: Source branch for staging only
        required: false
        default: dev
        type: string

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'production' &&
        github.ref == 'refs/heads/main' &&
        'pomo-production' || format('pomo-deploy-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: 11.8.0
  VERCEL_CLI_VERSION: 59.5.0
  VERCEL_ORG_ID: team_Ic8YKQ9jWkFLhVzeljhB4ZLV
  VERCEL_PROJECT_ID: prj_1GOayEsbALkhBglgOzza5COVs1tC

jobs:
  preview:
    name: Deploy PR Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pomo-audio-gateway-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: Preview – pomo-audio-gateway
      url: ${{ steps.pomo.outputs.url }}
    steps:
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NON_PRODUCTION_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_PREVIEW_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_PREVIEW_R2_SECRET_ACCESS_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${NON_PRODUCTION_TOKEN_SECRET}" || { echo "::error::POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET is not configured"; exit 1; }
          test -n "${R2_ACCESS_KEY_ID}" || { echo "::error::POMO_PAID_AUDIO_PREVIEW_R2_ACCESS_KEY_ID is not configured"; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY}" || { echo "::error::POMO_PAID_AUDIO_PREVIEW_R2_SECRET_ACCESS_KEY is not configured"; exit 1; }
          test -n "${VERCEL_TOKEN}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify audio gateway
        run: |
          pnpm --dir apps/pomo-audio-gateway lint
          pnpm --dir apps/pomo-audio-gateway typecheck
          pnpm exec vitest run \
            apps/pomo-audio-gateway/src/__tests__/index.spec.ts \
            apps/pomo/src/server/music/__tests__/track-upload.spec.ts \
            apps/pomo/src/server/music/__tests__/track-upload.validation.spec.ts \
            apps/pomo/src/server/music/track-upload/__tests__/preview.spec.ts \
            apps/pomo/src/server/music/track-upload/__tests__/storage.spec.ts \
            apps/pomo/scripts/build/storage/__tests__/delete-preview-audio.spec.ts \
            --project=unit \
            --reporter=dot
          pnpm --dir apps/pomo-audio-gateway build

      - name: Prepare Preview R2 bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-preview-r2.log
        run: |
          if ! pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket info \
            pomofi-paid-audio-preview; then
            pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket create \
              pomofi-paid-audio-preview || \
              pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket info \
                pomofi-paid-audio-preview
          fi
          pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket cors set \
            pomofi-paid-audio-preview \
            --file cors.preview.json \
            --force
          pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket lifecycle set \
            pomofi-paid-audio-preview \
            --file lifecycle.preview.json \
            --force

      - name: Upload PR Gateway version
        id: gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-preview.log
        run: |
          secret_file="${RUNNER_TEMP}/pomo-audio-gateway-preview-secrets.json"
          jq -n --arg secret "${PLAYBACK_TOKEN_SECRET}" \
            '{PLAYBACK_TOKEN_SECRET: $secret}' > "${secret_file}"
          chmod 600 "${secret_file}"
          if ! pnpm --dir apps/pomo-audio-gateway exec wrangler \
            deployments status \
            --env preview > /dev/null 2>&1; then
            pnpm --dir apps/pomo-audio-gateway exec wrangler deploy \
              --env preview \
              --secrets-file "${secret_file}"
          fi
          object_prefix="previews/pr-${PR_NUMBER}"
          upload_output="$(NO_COLOR=1 pnpm --dir apps/pomo-audio-gateway exec wrangler \
            versions upload \
            --env preview \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} ${GITHUB_SHA}" \
            --var "ALLOWED_ORIGINS:" \
            --var "ALLOWED_ORIGIN_SUFFIXES:.vercel.app" \
            --var "R2_OBJECT_PREFIX:${object_prefix}" \
            --secrets-file "${secret_file}")"
          printf '%s\n' "${upload_output}"
          gateway_url="$(printf '%s\n' "${upload_output}" | \
            grep -Eo "https://pr-${PR_NUMBER}-[^[:space:]]+\\.workers\\.dev" | tail -1)"
          test -n "${gateway_url}"
          echo "prefix=${object_prefix}" >> "${GITHUB_OUTPUT}"
          echo "url=${gateway_url}" >> "${GITHUB_OUTPUT}"

      - name: Pull Vercel Preview settings
        env:
          GITHUB_COMMIT_REF: ${{ github.event.pull_request.head.ref }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@${VERCEL_CLI_VERSION} pull
          --yes
          --environment=preview
          --git-branch="${GITHUB_COMMIT_REF}"

      - name: Deploy Pomo with PR audio storage
        id: pomo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          GITHUB_COMMIT_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          OBJECT_PREFIX: ${{ steps.gateway.outputs.prefix }}
          POMO_PAID_AUDIO_R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_PREVIEW_R2_ACCESS_KEY_ID }}
          POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_PREVIEW_R2_SECRET_ACCESS_KEY }}
          POMO_PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_json="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy \
            --target=preview \
            --archive=tgz \
            --yes \
            --no-wait \
            --json \
            --meta "githubDeployment=1" \
            --meta "githubCommitOrg=${GITHUB_REPOSITORY_OWNER}" \
            --meta "githubCommitRepo=${GITHUB_REPOSITORY_NAME}" \
            --meta "githubCommitRef=${GITHUB_COMMIT_REF}" \
            --meta "githubCommitSha=${GITHUB_COMMIT_SHA}" \
            --env "CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" \
            --env "POMO_PAID_AUDIO_R2_BUCKET=pomofi-paid-audio-preview" \
            --env "POMO_PAID_AUDIO_R2_PREFIX=${OBJECT_PREFIX}" \
            --env "POMO_PAID_AUDIO_R2_ACCESS_KEY_ID=${POMO_PAID_AUDIO_R2_ACCESS_KEY_ID}" \
            --env "POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY=${POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY}" \
            --env "POMO_AUDIO_GATEWAY_ORIGIN=${GATEWAY_URL}" \
            --env "POMO_PLAYBACK_TOKEN_SECRET=${POMO_PLAYBACK_TOKEN_SECRET}")"
          original_deployment_id="$(jq -er '.id' <<< "${deployment_json}")"
          deployment_url="$(jq -er '.url' <<< "${deployment_json}")"
          for _ in $(seq 1 15); do
            deployments_json="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} api \
              "/v6/deployments?projectId=${VERCEL_PROJECT_ID}&limit=20" \
              --raw)"
            replacement_url="$(jq -r --arg id "${original_deployment_id}" '
              [.deployments[] |
                select(.meta.originalDeploymentId == $id) |
                .url][0] // empty
            ' <<< "${deployments_json}")"
            if [ -n "${replacement_url}" ]; then
              deployment_url="${replacement_url}"
              break
            fi
            sleep 2
          done
          case "${deployment_url}" in
            http://*|https://*) ;;
            *) deployment_url="https://${deployment_url}" ;;
          esac
          pnpm dlx vercel@${VERCEL_CLI_VERSION} inspect \
            "${deployment_url}" \
            --wait \
            --timeout 15m
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify Preview CORS
        env:
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          POMO_URL: ${{ steps.pomo.outputs.url }}
        run: |
          status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: ${POMO_URL}" \
            "${GATEWAY_URL}/")"
          test "${status}" = "204"

  dev:
    name: Deploy dev
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pomo-audio-gateway-dev
      cancel-in-progress: true
    environment:
      name: Development – pomo-audio-gateway
      url: ${{ steps.pomo.outputs.url }}
    steps:
      - name: Validate dev branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "::error::Dev deployment must be dispatched from the dev branch."
            exit 1
          fi

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NON_PRODUCTION_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_SECRET_ACCESS_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "${NON_PRODUCTION_TOKEN_SECRET}" || { echo "::error::POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET is not configured"; exit 1; }
          test -n "${R2_ACCESS_KEY_ID}" || { echo "::error::POMO_PAID_AUDIO_DEV_R2_ACCESS_KEY_ID is not configured"; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY}" || { echo "::error::POMO_PAID_AUDIO_DEV_R2_SECRET_ACCESS_KEY is not configured"; exit 1; }
          test -n "${VERCEL_TOKEN}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify audio gateway
        run: |
          pnpm --dir apps/pomo-audio-gateway lint
          pnpm --dir apps/pomo-audio-gateway typecheck
          pnpm exec vitest run \
            apps/pomo-audio-gateway/src/__tests__/index.spec.ts \
            --project=unit \
            --reporter=dot
          pnpm --dir apps/pomo-audio-gateway build

      - name: Prepare dev R2 bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-dev-r2.log
        run: |
          if ! pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket info \
            pomofi-paid-audio-dev; then
            pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket create \
              pomofi-paid-audio-dev || \
              pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket info \
                pomofi-paid-audio-dev
          fi
          pnpm --dir apps/pomo-audio-gateway exec wrangler r2 bucket cors set \
            pomofi-paid-audio-dev \
            --file cors.preview.json \
            --force

      - name: Deploy dev Gateway
        id: gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-dev.log
        run: |
          secret_file="${RUNNER_TEMP}/pomo-audio-gateway-dev-secrets.json"
          jq -n --arg secret "${PLAYBACK_TOKEN_SECRET}" \
            '{PLAYBACK_TOKEN_SECRET: $secret}' > "${secret_file}"
          chmod 600 "${secret_file}"
          deploy_output="$(NO_COLOR=1 pnpm --dir apps/pomo-audio-gateway exec wrangler deploy \
            --env dev \
            --secrets-file "${secret_file}")"
          printf '%s\n' "${deploy_output}"
          gateway_url="$(printf '%s\n' "${deploy_output}" | \
            grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)"
          test -n "${gateway_url}"
          echo "url=${gateway_url}" >> "${GITHUB_OUTPUT}"

      - name: Pull Vercel Preview settings
        env:
          GITHUB_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@${VERCEL_CLI_VERSION} pull
          --yes
          --environment=preview
          --git-branch="${GITHUB_COMMIT_REF}"

      - name: Deploy Pomo with dev audio storage
        id: pomo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          GITHUB_COMMIT_REF: ${{ github.ref_name }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          POMO_PAID_AUDIO_R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_ACCESS_KEY_ID }}
          POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_SECRET_ACCESS_KEY }}
          POMO_PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_json="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy \
            --target=preview \
            --yes \
            --no-wait \
            --json \
            --meta "githubDeployment=1" \
            --meta "githubCommitOrg=${GITHUB_REPOSITORY_OWNER}" \
            --meta "githubCommitRepo=${GITHUB_REPOSITORY_NAME}" \
            --meta "githubCommitRef=${GITHUB_COMMIT_REF}" \
            --meta "githubCommitSha=${GITHUB_COMMIT_SHA}" \
            --env "CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" \
            --env "POMO_PAID_AUDIO_R2_BUCKET=pomofi-paid-audio-dev" \
            --env "POMO_PAID_AUDIO_R2_PREFIX=" \
            --env "POMO_PAID_AUDIO_R2_ACCESS_KEY_ID=${POMO_PAID_AUDIO_R2_ACCESS_KEY_ID}" \
            --env "POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY=${POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY}" \
            --env "POMO_AUDIO_GATEWAY_ORIGIN=${GATEWAY_URL}" \
            --env "POMO_PLAYBACK_TOKEN_SECRET=${POMO_PLAYBACK_TOKEN_SECRET}")"
          original_deployment_id="$(jq -er '.id' <<< "${deployment_json}")"
          deployment_url="$(jq -er '.url' <<< "${deployment_json}")"
          for _ in $(seq 1 15); do
            deployments_json="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} api \
              "/v6/deployments?projectId=${VERCEL_PROJECT_ID}&limit=20" \
              --raw)"
            replacement_url="$(jq -r --arg id "${original_deployment_id}" '
              [.deployments[] |
                select(.meta.originalDeploymentId == $id) |
                .url][0] // empty
            ' <<< "${deployments_json}")"
            if [ -n "${replacement_url}" ]; then
              deployment_url="${replacement_url}"
              break
            fi
            sleep 2
          done
          case "${deployment_url}" in
            http://*|https://*) ;;
            *) deployment_url="https://${deployment_url}" ;;
          esac
          pnpm dlx vercel@${VERCEL_CLI_VERSION} inspect \
            "${deployment_url}" \
            --wait \
            --timeout 15m
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

  staging:
    name: Deploy selected branch to staging
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    concurrency:
      group: pomo-staging
      cancel-in-progress: false
    env:
      SOURCE_BRANCH: ${{ inputs.staging_branch || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Staging – pomo
      url: https://staging.pomofi.io
    steps:
      - name: Validate branch name
        run: git check-ref-format --branch "${SOURCE_BRANCH}"

      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ env.SOURCE_BRANCH }}
          persist-credentials: false

      - name: Capture source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NON_PRODUCTION_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_SECRET_ACCESS_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NEON_PROJECT_ID \
            NEON_API_KEY NON_PRODUCTION_TOKEN_SECRET R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY VERCEL_TOKEN; do
            test -n "${!name}" || { echo "::error::${name} is not configured"; exit 1; }
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare persistent staging database
        id: database
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: staging
          get_auth_url: true
          suspend_timeout: 300

      - name: Validate staging database and auth
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.database.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.database.outputs.auth_url }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::Staging database URL is missing"; exit 1; }
          test -n "${DATABASE_URL_UNPOOLED}" || { echo "::error::Staging migration URL is missing"; exit 1; }
          test -n "${NEON_AUTH_BASE_URL}" || { echo "::error::Neon Auth must be enabled on the staging database branch"; exit 1; }

      - name: Configure staging auth redirect domain
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.database.outputs.branch_id }}
        run: |
          domains_url="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_BRANCH_ID}/auth/domains"
          domains="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${NEON_API_KEY}" "${domains_url}")"
          if ! jq -e '[.. | strings] | index("https://staging.pomofi.io") != null' \
            <<< "${domains}" > /dev/null; then
            curl --fail --silent --show-error --max-time 30 \
              --request POST --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header 'Content-Type: application/json' \
              --data '{"domain":"https://staging.pomofi.io","auth_provider":"better_auth"}' \
              "${domains_url}" > /dev/null
          fi
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${NEON_API_KEY}" "${domains_url}" | \
            jq -e '[.. | strings] | index("https://staging.pomofi.io") != null'

      - name: Verify audio gateway
        run: |
          pnpm --dir apps/pomo-audio-gateway lint
          pnpm --dir apps/pomo-audio-gateway typecheck
          pnpm exec vitest run apps/pomo-audio-gateway/src/__tests__/index.spec.ts \
            --project=unit --reporter=dot
          pnpm --dir apps/pomo-audio-gateway build

      - name: Deploy staging audio gateway
        id: gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-staging.log
        run: |
          config_file="${RUNNER_TEMP}/pomo-audio-gateway-staging.jsonc"
          gh api "repos/${GITHUB_REPOSITORY}/contents/apps/pomo-audio-gateway/wrangler.jsonc?ref=${WORKFLOW_SHA}" \
            --header 'Accept: application/vnd.github.raw+json' > "${config_file}"
          secret_file="${RUNNER_TEMP}/pomo-audio-gateway-staging-secrets.json"
          umask 077
          jq -n --arg secret "${PLAYBACK_TOKEN_SECRET}" \
            '{PLAYBACK_TOKEN_SECRET: $secret}' > "${secret_file}"
          deploy_output="$(NO_COLOR=1 pnpm --dir apps/pomo-audio-gateway exec wrangler deploy \
            "${GITHUB_WORKSPACE}/apps/pomo-audio-gateway/src/index.ts" \
            --config "${config_file}" \
            --tsconfig "${GITHUB_WORKSPACE}/apps/pomo-audio-gateway/tsconfig.json" \
            --env staging \
            --secrets-file "${secret_file}")"
          printf '%s\n' "${deploy_output}"
          gateway_url="$(printf '%s\n' "${deploy_output}" | \
            grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)"
          test -n "${gateway_url}"
          echo "url=${gateway_url}" >> "${GITHUB_OUTPUT}"

      - name: Pull Vercel staging settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=staging

      - name: Deploy Pomo staging
        id: pomo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.database.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.database.outputs.auth_url }}
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          POMO_PAID_AUDIO_R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_ACCESS_KEY_ID }}
          POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_SECRET_ACCESS_KEY }}
          POMO_PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy \
            --target=staging --yes \
            --meta 'githubDeployment=0' \
            --meta "githubCommitOrg=${GITHUB_REPOSITORY_OWNER}" \
            --meta "githubCommitRepo=${GITHUB_REPOSITORY#*/}" \
            --meta "githubCommitRef=${SOURCE_BRANCH}" \
            --meta "githubCommitSha=${SOURCE_SHA}" \
            --build-env "DATABASE_URL=${DATABASE_URL}" \
            --build-env "DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}" \
            --build-env "NEON_AUTH_BASE_URL=${NEON_AUTH_BASE_URL}" \
            --build-env 'POMO_PUBLIC_ORIGIN=https://staging.pomofi.io' \
            --env "DATABASE_URL=${DATABASE_URL}" \
            --env "DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}" \
            --env "NEON_AUTH_BASE_URL=${NEON_AUTH_BASE_URL}" \
            --env 'POMO_PUBLIC_ORIGIN=https://staging.pomofi.io' \
            --env "CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" \
            --env 'POMO_PAID_AUDIO_R2_BUCKET=pomofi-paid-audio-dev' \
            --env 'POMO_PAID_AUDIO_R2_PREFIX=staging/' \
            --env "POMO_PAID_AUDIO_R2_ACCESS_KEY_ID=${POMO_PAID_AUDIO_R2_ACCESS_KEY_ID}" \
            --env "POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY=${POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY}" \
            --env "POMO_AUDIO_GATEWAY_ORIGIN=${GATEWAY_URL}" \
            --env "POMO_PLAYBACK_TOKEN_SECRET=${POMO_PLAYBACK_TOKEN_SECRET}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test deployment and gateway
        env:
          DEPLOYMENT_URL: ${{ steps.pomo.outputs.url }}
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for path in / /api/feeds/today-in-history/rss.xml; do
            pnpm dlx vercel@${VERCEL_CLI_VERSION} curl "${path}" \
              --deployment="${DEPLOYMENT_URL}" \
              -- --fail --silent --show-error --max-time 30 --output /dev/null
          done
          status="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS --header 'Origin: https://staging.pomofi.io' \
            "${GATEWAY_URL}/")"
          test "${status}" = "204"

      - name: Assign staging domain
        env:
          DEPLOYMENT_URL: ${{ steps.pomo.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} alias set "${DEPLOYMENT_URL}" staging.pomofi.io

      - name: Report staging deployment
        env:
          DEPLOYMENT_URL: ${{ steps.pomo.outputs.url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf 'Branch: `%s`\n\nCommit: `%s`\n\nStaging: https://staging.pomofi.io\n\nDeployment: %s\n' \
            "${SOURCE_BRANCH}" "${SOURCE_SHA}" "${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"

  audio-gateway:
    name: Deploy audio gateway first
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.changes.outputs.deploy }}
      previous_version: ${{ steps.previous.outputs.version }}
    steps:
      - name: Validate release source
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Select the main branch when running this workflow."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect audio gateway changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || \
            [ -z "${BEFORE_SHA}" ] || \
            [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${BEFORE_SHA}" "${GITHUB_SHA}" -- \
            apps/pomo-audio-gateway \
            packages/playback-token \
            package.json \
            pnpm-lock.yaml; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.deploy == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changes.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare credentials
        if: steps.changes.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }

      - name: Verify audio gateway
        if: steps.changes.outputs.deploy == 'true'
        run: |
          pnpm --dir apps/pomo-audio-gateway lint
          pnpm --dir apps/pomo-audio-gateway typecheck
          pnpm exec vitest run \
            apps/pomo-audio-gateway/src/__tests__/index.spec.ts \
            --project=unit \
            --reporter=dot
          pnpm --dir apps/pomo-audio-gateway build

      - name: Capture current production Gateway version
        id: previous
        if: steps.changes.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-production-status.log
        run: |
          deployment_json="$(pnpm --dir apps/pomo-audio-gateway exec wrangler \
            deployments status \
            --env= \
            --json)"
          version="$(jq -er '
            [.versions[] | select(.percentage == 100)] |
            if length == 1 then .[0].version_id
            else error("production Gateway must have one 100% version")
            end
          ' <<< "${deployment_json}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Deploy production audio gateway
        if: steps.changes.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-production.log
        run: pnpm --dir apps/pomo-audio-gateway exec wrangler deploy --env=

  deploy:
    name: Migrate and deploy
    needs: audio-gateway
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production – pomo
      url: ${{ steps.stage.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@${VERCEL_CLI_VERSION} pull
          --yes
          --environment=production

      - name: Report pending production migration review items
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@${VERCEL_CLI_VERSION} env run \
            --environment=production \
            -- sh -eu -c 'exec pnpm --dir apps/pomo db:check-production-migrations'

      - name: Migrate production database
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@${VERCEL_CLI_VERSION} env run \
            --environment=production \
            -- sh -eu -c '
              if [ -z "${DATABASE_URL_UNPOOLED:-}" ]; then
                echo "DATABASE_URL_UNPOOLED is required for production migrations." >&2
                exit 1
              fi
              pnpm --dir apps/pomo exec drizzle-kit check
              exec pnpm --dir apps/pomo db:migrate
            '

      - name: Capture current default deployment
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_json="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} \
            inspect "https://pomo-bichis-projects.vercel.app" \
            --json)"
          deployment_url="$(jq -er '.url | select(type == "string" and length > 0)' \
            <<< "${deployment_json}")"
          echo "url=https://${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Stage production deployment
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy \
            --prod \
            --skip-domain)"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Validate staged build outputs
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_json="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} \
            inspect "${DEPLOYMENT_URL}" \
            --json)"
          jq -e '
            .readyState == "READY" and
            any(.builds[]?.output[]?; .type == "lambda" and .path == "__server")
          ' <<< "${deployment_json}" > /dev/null

      - name: Smoke test staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for path in / /api/feeds/today-in-history/rss.xml; do
            pnpm dlx vercel@${VERCEL_CLI_VERSION} curl "${path}" \
              --deployment="${DEPLOYMENT_URL}" \
              -- \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              --output /dev/null
          done

      - name: Promote staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@${VERCEL_CLI_VERSION}
          promote "${DEPLOYMENT_URL}"
          --yes

      - name: Restore default deployment after failure
        if: ${{ failure() && steps.stage.outcome == 'success' }}
        env:
          PREVIOUS_DEPLOYMENT_URL: ${{ steps.previous.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@${VERCEL_CLI_VERSION}
          alias set "${PREVIOUS_DEPLOYMENT_URL}"
          pomo-bichis-projects.vercel.app

  rollback-audio-gateway:
    name: Roll back audio gateway after Pomo failure
    needs:
      - audio-gateway
      - deploy
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      github.ref == 'refs/heads/main' &&
      needs.audio-gateway.result == 'success' &&
      needs.audio-gateway.outputs.deployed == 'true' &&
      needs.deploy.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore previous production Gateway version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_GATEWAY_VERSION: ${{ needs.audio-gateway.outputs.previous_version }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-production-rollback.log
        run: |
          test -n "${PREVIOUS_GATEWAY_VERSION}" || { echo "::error::Previous Gateway version is unavailable"; exit 1; }
          pnpm --dir apps/pomo-audio-gateway exec wrangler rollback \
            "${PREVIOUS_GATEWAY_VERSION}" \
            --env= \
            --message "Restore Gateway after failed Pomo deployment ${GITHUB_SHA}" \
            --yes
