name: Deploy Pomo Staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Repository branch to deploy to staging.pomofi.io
        required: true
        default: dev
        type: string
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

run-name: Deploy Pomo staging from ${{ inputs.branch }}

concurrency:
  group: pomo-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: 11.8.0
  VERCEL_CLI_VERSION: 59.5.0
  VERCEL_ORG_ID: team_Ic8YKQ9jWkFLhVzeljhB4ZLV
  VERCEL_PROJECT_ID: prj_1GOayEsbALkhBglgOzza5COVs1tC

jobs:
  deploy:
    name: Deploy selected branch to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Staging – pomo
      url: https://staging.pomofi.io
    steps:
      - name: Validate branch name
        env:
          SOURCE_BRANCH: ${{ inputs.branch }}
        run: git check-ref-format --branch "${SOURCE_BRANCH}"

      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false

      - name: Capture source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NON_PRODUCTION_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_SECRET_ACCESS_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NEON_PROJECT_ID \
            NEON_API_KEY NON_PRODUCTION_TOKEN_SECRET R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY VERCEL_TOKEN; do
            test -n "${!name}" || { echo "::error::${name} is not configured"; exit 1; }
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare persistent staging database
        id: database
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: staging
          get_auth_url: true
          suspend_timeout: 300

      - name: Validate staging database and auth
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.database.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.database.outputs.auth_url }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::Staging database URL is missing"; exit 1; }
          test -n "${DATABASE_URL_UNPOOLED}" || { echo "::error::Staging migration URL is missing"; exit 1; }
          test -n "${NEON_AUTH_BASE_URL}" || { echo "::error::Neon Auth must be enabled on the staging database branch"; exit 1; }

      - name: Verify audio gateway
        run: |
          pnpm --dir apps/pomo-audio-gateway lint
          pnpm --dir apps/pomo-audio-gateway typecheck
          pnpm exec vitest run apps/pomo-audio-gateway/src/__tests__/index.spec.ts \
            --project=unit --reporter=dot
          pnpm --dir apps/pomo-audio-gateway build

      - name: Deploy staging audio gateway
        id: gateway
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/pomo-audio-gateway-staging.log
        run: |
          secret_file="${RUNNER_TEMP}/pomo-audio-gateway-staging-secrets.json"
          umask 077
          jq -n --arg secret "${PLAYBACK_TOKEN_SECRET}" \
            '{PLAYBACK_TOKEN_SECRET: $secret}' > "${secret_file}"
          deploy_output="$(NO_COLOR=1 pnpm --dir apps/pomo-audio-gateway exec wrangler deploy \
            --env dev \
            --name pomofi-audio-gateway-staging \
            --var 'ALLOWED_ORIGINS:https://staging.pomofi.io' \
            --var 'ALLOWED_ORIGIN_SUFFIXES:.vercel.app' \
            --var 'R2_OBJECT_PREFIX:staging' \
            --secrets-file "${secret_file}")"
          printf '%s\n' "${deploy_output}"
          gateway_url="$(printf '%s\n' "${deploy_output}" | \
            grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)"
          test -n "${gateway_url}"
          echo "url=${gateway_url}" >> "${GITHUB_OUTPUT}"

      - name: Pull Vercel staging settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=staging

      - name: Deploy Pomo staging
        id: pomo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.database.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ steps.database.outputs.auth_url }}
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          POMO_PAID_AUDIO_R2_ACCESS_KEY_ID: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_ACCESS_KEY_ID }}
          POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY: ${{ secrets.POMO_PAID_AUDIO_DEV_R2_SECRET_ACCESS_KEY }}
          POMO_PLAYBACK_TOKEN_SECRET: ${{ secrets.POMO_AUDIO_GATEWAY_NON_PRODUCTION_TOKEN_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy \
            --target=staging --yes --skip-domain \
            --meta "githubCommitOrg=${GITHUB_REPOSITORY_OWNER}" \
            --meta "githubCommitRepo=${GITHUB_REPOSITORY#*/}" \
            --meta "githubCommitRef=${SOURCE_BRANCH}" \
            --meta "githubCommitSha=${SOURCE_SHA}" \
            --build-env "DATABASE_URL=${DATABASE_URL}" \
            --build-env "DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}" \
            --build-env "NEON_AUTH_BASE_URL=${NEON_AUTH_BASE_URL}" \
            --build-env 'VITE_POMO_PUBLIC_ORIGIN=https://staging.pomofi.io' \
            --env "DATABASE_URL=${DATABASE_URL}" \
            --env "DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}" \
            --env "NEON_AUTH_BASE_URL=${NEON_AUTH_BASE_URL}" \
            --env 'VITE_POMO_PUBLIC_ORIGIN=https://staging.pomofi.io' \
            --env "CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}" \
            --env 'POMO_PAID_AUDIO_R2_BUCKET=pomofi-paid-audio-dev' \
            --env 'POMO_PAID_AUDIO_R2_PREFIX=staging/' \
            --env "POMO_PAID_AUDIO_R2_ACCESS_KEY_ID=${POMO_PAID_AUDIO_R2_ACCESS_KEY_ID}" \
            --env "POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY=${POMO_PAID_AUDIO_R2_SECRET_ACCESS_KEY}" \
            --env "POMO_AUDIO_GATEWAY_ORIGIN=${GATEWAY_URL}" \
            --env "POMO_PLAYBACK_TOKEN_SECRET=${POMO_PLAYBACK_TOKEN_SECRET}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test deployment and gateway
        env:
          DEPLOYMENT_URL: ${{ steps.pomo.outputs.url }}
          GATEWAY_URL: ${{ steps.gateway.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for path in / /api/feeds/today-in-history/rss.xml; do
            pnpm dlx vercel@${VERCEL_CLI_VERSION} curl "${path}" \
              --deployment="${DEPLOYMENT_URL}" \
              -- --fail --silent --show-error --max-time 30 --output /dev/null
          done
          status="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS --header 'Origin: https://staging.pomofi.io' \
            "${GATEWAY_URL}/")"
          test "${status}" = "204"

      - name: Assign staging domain
        env:
          DEPLOYMENT_URL: ${{ steps.pomo.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${VERCEL_CLI_VERSION} alias set "${DEPLOYMENT_URL}" staging.pomofi.io

      - name: Report staging deployment
        env:
          DEPLOYMENT_URL: ${{ steps.pomo.outputs.url }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf 'Branch: `%s`\n\nCommit: `%s`\n\nStaging: https://staging.pomofi.io\n\nDeployment: %s\n' \
            "${SOURCE_BRANCH}" "${SOURCE_SHA}" "${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
