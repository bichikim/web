name: Deploy Poffo Themes
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('Deploy Poffo Themes ({0}) from {1} at {2}', inputs.environment, github.ref_name, github.sha) ||
      github.event.pull_request.title }}

on:
  pull_request:
    paths:
      - apps/poffo-themes/**
      - apps/wallpaper-web/public/wallpapers/ash-afternoon/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/actions/poffo-themes/**
      - .github/workflows/poffo-themes-*.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

concurrency:
  group: poffo-themes-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_Ic8YKQ9jWkFLhVzeljhB4ZLV
  VERCEL_PROJECT_ID: ${{ vars.POFFO_THEMES_VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 59.5.0

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && ((inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
        (inputs.environment == 'production' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/poffo-themes/verify
  deploy-preview:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/poffo-themes/deploy
        with:
          target: preview
          token: ${{ secrets.VERCEL_TOKEN }}
  deploy-production:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production – poffo-themes
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/poffo-themes/deploy
        id: deploy
        with:
          target: production
          token: ${{ secrets.VERCEL_TOKEN }}
