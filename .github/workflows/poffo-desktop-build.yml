name: Build Poffo Desktop

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to validate
        type: choice
        default: all
        options:
          - all
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
      reuse-run:
        description: Validate unchanged installers from an earlier build run
        type: string
        default: ''

run-name: ${{ inputs.reuse-run != '' && format('Validate Poffo installers from run {0}', inputs.reuse-run) || format('Build Poffo Desktop from {0}', github.ref_name) }}

concurrency:
  group: poffo-desktop-${{ github.ref }}-${{ inputs.target }}-${{ inputs.reuse-run }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: 11.8.0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15-intel","x86_64-pc-windows-msvc":"windows-2025"}')[matrix.target] }}
    timeout-minutes: 60
    env:
      BUNDLE_TYPE: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'nsis' || 'dmg' }}
      INSTALLER_EXTENSION: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'exe' || 'dmg' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ inputs.target == 'all' && fromJSON('["aarch64-apple-darwin","x86_64-apple-darwin","x86_64-pc-windows-msvc"]') || fromJSON(format('["{0}"]', inputs.target)) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        if: inputs.reuse-run == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        if: inputs.reuse-run == ''
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/poffo/src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native runner architecture
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const expected = {
            'aarch64-apple-darwin': ['darwin', 'arm64'],
            'x86_64-apple-darwin': ['darwin', 'x64'],
            'x86_64-pc-windows-msvc': ['win32', 'x64'],
          }[process.env.BUILD_TARGET]
          assert.deepEqual([process.platform, process.arch], expected)
          console.log(JSON.stringify({platform: process.platform, arch: process.arch, node: process.version}))
          NODE

      - name: Download unchanged installer
        id: reuse
        if: inputs.reuse-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ matrix.target }}
          REUSED_RUN: ${{ inputs.reuse-run }}
        run: |
          gh run download "$REUSED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "poffo-desktop-$BUILD_TARGET-$REUSED_RUN" \
            --dir "apps/poffo/src-tauri/target/$BUILD_TARGET/release/bundle/$BUNDLE_TYPE"
          gh run view "$REUSED_RUN" --repo "$GITHUB_REPOSITORY" --json headSha \
            --jq '"POFFO_INSTALLER_SOURCE_SHA=" + .headSha' >> "$GITHUB_ENV"

      - name: Prepare verified Windows installer tools
        if: runner.os == 'Windows' && inputs.reuse-run == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP 'poffo-nsis'
          New-Item -ItemType Directory -Force $downloads | Out-Null
          gh release download nsis-3.13 --repo tauri-apps/binary-releases --pattern nsis-3.13.zip --dir $downloads
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed' }
          gh release download nsis_tauri_utils-v0.5.3 --repo tauri-apps/nsis-tauri-utils --pattern nsis_tauri_utils.dll --dir $downloads
          if ($LASTEXITCODE -ne 0) { throw 'NSIS plugin download failed' }
          # Match the hashes in tauri-cli-v2.12.4's NSIS bundler.
          $expected = @{
            'nsis-3.13.zip' = 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E'
            'nsis_tauri_utils.dll' = '75197FEE3C6A814FE035788D1C34EAD39349B860'
          }
          foreach ($name in $expected.Keys) {
            if ((Get-FileHash (Join-Path $downloads $name) -Algorithm SHA1).Hash -ne $expected[$name]) {
              throw "Unexpected installer tool hash: $name"
            }
          }
          Expand-Archive -LiteralPath (Join-Path $downloads 'nsis-3.13.zip') -DestinationPath $downloads
          $toolset = Join-Path $env:LOCALAPPDATA 'tauri/NSIS'
          New-Item -ItemType Directory -Force $toolset | Out-Null
          Copy-Item -Path (Join-Path $downloads 'nsis-3.13/*') -Destination $toolset -Recurse -Force
          $plugins = Join-Path $toolset 'Plugins/x86-unicode/additional'
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Copy-Item -LiteralPath (Join-Path $downloads 'nsis_tauri_utils.dll') -Destination $plugins

      - name: Build desktop installer
        id: build
        if: inputs.reuse-run == ''
        run: |
          pnpm --filter @winter-love/poffo exec tauri build --ci \
            --target "${{ matrix.target }}" --bundles "${{ env.BUNDLE_TYPE }}" -- --locked

      - name: Record installer provenance
        env:
          BUILD_TARGET: ${{ matrix.target }}
          REUSED_RUN: ${{ inputs.reuse-run }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto'
          import {createReadStream} from 'node:fs'
          import {mkdir, readdir, writeFile} from 'node:fs/promises'
          import {join} from 'node:path'
          const directory = `apps/poffo/src-tauri/target/${process.env.BUILD_TARGET}/release/bundle/${process.env.BUNDLE_TYPE}`
          const name = (await readdir(directory)).find(name => name.endsWith(`.${process.env.INSTALLER_EXTENSION}`))
          if (name === undefined) throw new Error('Installer is missing')
          const hash = createHash('sha256')
          for await (const chunk of createReadStream(join(directory, name))) hash.update(chunk)
          const output = join(process.env.RUNNER_TEMP, 'poffo-validation')
          await mkdir(output, {recursive: true})
          await writeFile(join(output, 'installer.json'), JSON.stringify({
            name, sha256: hash.digest('hex'), target: process.env.BUILD_TARGET,
            sourceRun: process.env.REUSED_RUN || process.env.GITHUB_RUN_ID,
            sourceCommit: process.env.POFFO_INSTALLER_SOURCE_SHA || process.env.GITHUB_SHA,
            validationRun: process.env.GITHUB_RUN_ID,
          }, null, 2))
          NODE

      - name: Install macOS artifact outside the checkout
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          destination="$RUNNER_TEMP/Poffo installed"
          mounted="$(mktemp -d)"
          installer="$(find "apps/poffo/src-tauri/target/$BUILD_TARGET/release/bundle/dmg" -name '*.dmg' -print -quit)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mounted" "$installer"
          trap 'hdiutil detach "$mounted"' EXIT
          mkdir -p "$destination"
          ditto "$mounted/Poffo.app" "$destination/Poffo App.app"
          echo "POFFO_INSTALLED_CLI=$destination/Poffo App.app/Contents/MacOS/poffo-cli" >> "$GITHUB_ENV"

      - name: Install Windows artifact outside the checkout
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Poffo installed'
          $installer = Get-ChildItem "apps/poffo/src-tauri/target/$env:BUILD_TARGET/release/bundle/nsis/*.exe" | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          "POFFO_INSTALLED_CLI=$destination/poffo-cli.exe" >> $env:GITHUB_ENV

      - name: Install Chromium for installed runtime validation
        run: pnpm exec playwright install chromium

      - name: Validate installed Node, CLI, MCP and real character workflow
        env:
          POFFO_VALIDATION_OUTPUT: ${{ runner.temp }}/poffo-validation
        run: pnpm exec playwright test --config apps/poffo/playwright.character.config.ts --project chromium

      - name: Upload runtime validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: poffo-validation-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/poffo-validation/
            apps/poffo/test-results/**/*.png
            apps/poffo/test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installer
        id: installer
        if: always() && (steps.build.outcome == 'success' || steps.reuse.outcome == 'success')
        uses: actions/upload-artifact@v7
        with:
          name: poffo-desktop-${{ matrix.target }}-${{ github.run_id }}
          overwrite: true
          path: apps/poffo/src-tauri/target/${{ matrix.target }}/release/bundle/${{ env.BUNDLE_TYPE }}/*.${{ env.INSTALLER_EXTENSION }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Summarize download
        if: always() && steps.installer.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          echo "[Download ${BUILD_TARGET} installer](${ARTIFACT_URL}) (retained for 30 days)." >> "$GITHUB_STEP_SUMMARY"
