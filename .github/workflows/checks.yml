name: Checks

on:
  pull_request:

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build Puppet distribution
        run: pnpm --filter @winter-love/puppet build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Oxlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Puppet distribution
        run: pnpm --filter @winter-love/puppet build

      - name: Run unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm run test:vitest --changed="$BASE_SHA" --passWithNoTests

  integration-scope:
    name: Select integration tests
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
      projects: ${{ steps.scope.outputs.projects }}
      directories: ${{ steps.scope.outputs.directories }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Check integration scope rules
        run: node --test scripts/ci/__tests__/integration-scope.spec.mjs

      - name: Select affected integration tests
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/integration-scope.mjs "$BASE_SHA"

  integration-tests:
    name: Integration tests
    needs: integration-scope
    if: needs.integration-scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install Solargraph
        run: gem install solargraph --version 0.60.4 --no-document

      - name: Build Code Viewer distribution
        run: pnpm --filter @winter-love/codex-code-viewer build

      - name: Build Puppet distribution
        run: pnpm --filter @winter-love/puppet build

      - name: Install integration test browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run integration tests
        env:
          INTEGRATION_PROJECTS: ${{ needs.integration-scope.outputs.projects }}
          INTEGRATION_DIRECTORIES: ${{ needs.integration-scope.outputs.directories }}
        run: |
          project_lines=$(jq -r '.[] | "--project=" + .' <<< "$INTEGRATION_PROJECTS")
          mapfile -t projects <<< "$project_lines"
          directories=()
          if [[ "$INTEGRATION_DIRECTORIES" != '[]' ]]; then
            directory_lines=$(jq -r --arg workspace "$GITHUB_WORKSPACE" '.[] | $workspace + "/" + . + "/"' <<< "$INTEGRATION_DIRECTORIES")
            mapfile -t directories <<< "$directory_lines"
            projects+=(--passWithNoTests)
          fi
          pnpm test:integration "${projects[@]}" "${directories[@]}"

  tests:
    name: Tests
    needs:
      - typecheck
      - unit-tests
      - integration-scope
      - integration-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_SCOPE_RESULT: ${{ needs.integration-scope.result }}
          INTEGRATION_REQUIRED: ${{ needs.integration-scope.outputs.required }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
        run: |
          if [[ "$TYPECHECK_RESULT" != 'success' || "$UNIT_TESTS_RESULT" != 'success' || "$INTEGRATION_SCOPE_RESULT" != 'success' ]]; then
            exit 1
          fi
          case "$INTEGRATION_REQUIRED:$INTEGRATION_TESTS_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
