name: Clean up Pomo Preview Database

on:
  pull_request:
    types:
      - closed

concurrency:
  group: pomo-preview-database-cleanup-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete Preview database branch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Delete Neon Preview branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BRANCH_NAME: preview/${{ github.event.pull_request.head.ref }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node apps/pomo/scripts/database/delete-preview-branch.mjs
