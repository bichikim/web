name: Deploy Coong

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

run-name: Deploy Coong (${{ inputs.environment }}) from ${{ github.ref_name }} at ${{ github.sha }}

concurrency:
  group: coong-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  VERCEL_CLI_VERSION: 59.5.0
  VERCEL_DEPLOY_ENVIRONMENT: ${{ inputs.environment == 'dev' && 'preview' || 'production' }}
  VERCEL_DEPLOY_TARGET_ARG: ${{ inputs.environment == 'dev' && '--target=preview' || '--prod' }}
  VERCEL_ORG_ID: team_Ic8YKQ9jWkFLhVzeljhB4ZLV
  VERCEL_PROJECT_ID: prj_WM157z2KV8cYjK0Tt2nYCqZzIFzQ
jobs:
  build-client:
    if: (inputs.environment == 'dev' && github.ref == 'refs/heads/dev') || (inputs.environment == 'production' && github.ref == 'refs/heads/main')
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment source
        env:
          DEPLOYMENT_BRANCH: ${{ inputs.environment == 'dev' && 'dev' || 'main' }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/${DEPLOYMENT_BRANCH}" || {
            echo "::error::Select the ${DEPLOYMENT_BRANCH} branch for this deployment."
            exit 1
          }

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare Pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Setup Playwright cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-headless-shell

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Unit Test
        run: pnpm test:vitest

      - name: Build
        run: pnpm --filter @apps/coong run build

  deploy-client:
    name: Deploy Client
    runs-on: ubuntu-latest
    needs: build-client
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare Pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pull_args=("--environment=${VERCEL_DEPLOY_ENVIRONMENT}")
          if [[ "$VERCEL_DEPLOY_ENVIRONMENT" == preview ]]; then
            pull_args+=("--git-branch=${GITHUB_REF_NAME}")
          fi
          pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes "${pull_args[@]}" --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${{ env.VERCEL_CLI_VERSION }} build "$VERCEL_DEPLOY_TARGET_ARG" --token="$VERCEL_TOKEN"

      - name: Deploy Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt "$VERCEL_DEPLOY_TARGET_ARG" --token="$VERCEL_TOKEN"
