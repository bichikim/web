[package]
name = "wallpaper-desktop"
version = "0.1.0"
description = "Local desktop wallpaper utility"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
toml_edit = "0.25.13"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["sync", "macros", "process", "io-util", "time", "fs", "net"] }
tauri = { version = "~2.11", features = [
  "macos-private-api",
  "tray-icon",
  "unstable",
  "protocol-asset",
] }
tauri-plugin-desktop-surface = { path = "../../../packages/desktop-surface" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAMetalLayer"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSSavePanel", "NSWindow", "NSGraphics", "NSView", "objc2-quartz-core", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
bytemuck = "=1.25.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "webp", "jpeg"] }
poffo-gpu = { path = "../../../packages/puppet/native/renderer" }
poffo-runtime = { path = "../../../packages/puppet/native/runtime", features = ["parallel"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Keep full model checksum verification fast in development builds as well.
[profile.dev.package.sha2]
opt-level = 3


[profile.dev.package.poffo-runtime]
opt-level = 3

[profile.dev.package.poffo-gpu]
opt-level = 3
